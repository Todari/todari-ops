# Build-script approvals. pnpm 11 reads allowBuilds; onlyBuiltDependencies
# kept for pnpm 10 compatibility. Without this, install hard-fails with
# ERR_PNPM_IGNORED_BUILDS (esbuild comes in via tsx).
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.268'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.268'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.268'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.268'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.268'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.268'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.268'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.268'
  - '@anthropic-ai/claude-agent-sdk@0.3.268'
onlyBuiltDependencies:
  - esbuild
# 간접 의존성 보안 패치(Dependabot이 pnpm 11 잠금 파일의 간접 의존성은 올리지 못해 매번 실패한다).
# 취약한 범위만 패치 버전으로 올린다. 상위 패키지가 패치 버전을 직접 요구하게 되면 지운다.
overrides:
  'vite@>=8 <8.2.4': ^8.2.4
  'hono@<4.13.11': ^4.13.11
  'proxy-addr@<2.0.8': ^2.0.8
  '@modelcontextprotocol/sdk@<1.31.0': ^1.31.0
  'source-map-js@<1.2.2': ^1.2.2
  'fast-uri@<3.1.8': ^3.1.8
  'ip-address@<10.7.1': ^10.7.1
  'zod@>=4.0.0 <4.6.6': ^4.6.6
  'body-parser@>=2.0.0 <2.4.0': ^2.4.0
  'qs@>=6.7.0 <=6.16.0': ^6.16.1
  '@hono/node-server@>=1.19.10 <2.1.3': ^2.1.3
