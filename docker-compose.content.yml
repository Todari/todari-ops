services:
  bot:
    env_file:
      - path: .env.content
        required: false
    environment:
      CONTENT_ENABLED: "true"
      CONTENT_EXECUTOR: worker

  content-worker:
    build:
      context: .
      dockerfile: Dockerfile.content
    restart: unless-stopped
    init: true
    env_file:
      - path: .env.content
        required: false
    environment:
      WORK_DIR: /data/work
      WAENYAMYEON_ROOT: /data/content-repos/waenyamyeon
      INSTATOON_ROOT: /data/content-repos/instatoon-studio
    volumes:
      - type: volume
        source: bot_workdata
        target: /data/work/content
        volume:
          subpath: work/content
      - type: bind
        source: ${CONTENT_REPOS_DIR:-/home/ubuntu/content-repos}
        target: /data/content-repos
        bind:
          create_host_path: false
    shm_size: 1gb
    cpus: 1.0
    mem_limit: 1800m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
