app = "todari-ops"
primary_region = "nrt"

[build]

[env]
  NODE_ENV = "production"
  WORK_DIR = "/data/work"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[mounts]]
  source = "todari_ops_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
